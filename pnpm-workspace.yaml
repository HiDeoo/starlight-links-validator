packages:
  - 'docs'
  - 'packages/**/*'

allowBuilds:
  esbuild: false
  sharp: false
  unrs-resolver: false

# Prevent installing packages published in the last 3 days.
minimumReleaseAge: 4320

minimumReleaseAgeExclude:
  - '@hideoo/eslint-config@5.2.0'
  - '@hideoo/starlight-plugins-docs-components@0.5.0'
  - starlight-package-managers@0.13.0
  - '@astrojs/markdown-satteri@0.4.5'
  - '@astrojs/prism@4.1.1'
  - '@astrojs/starlight@0.42.7'
  - '@astrojs/telemetry@3.4.1'
  - astro@7.4.2
